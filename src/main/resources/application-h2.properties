# Perfil alternativo com banco H2 em memória para testes ou apresentações sem MySQL local
spring.datasource.url=jdbc:h2:mem:grupo_nexus_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
nexus.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
nexus.jwt.expiration-ms=86400000
