# SQLite local por padrão; em hospedagem, sobrescreva via variáveis SPRING_DATASOURCE_*.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:sqlite:gestao-funcionarios.db}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.sqlite.JDBC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# Dialeto SQLite local; use org.hibernate.dialect.PostgreSQLDialect com PostgreSQL.
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.community.dialect.SQLiteDialect}

# Em produção, configure NEXUS_JWT_SECRET como variável de ambiente.
nexus.jwt.secret=${NEXUS_JWT_SECRET:local-dev-only-secret-change-before-deploy-0123456789abcdef}
nexus.jwt.expiration-ms=${NEXUS_JWT_EXPIRATION_MS:86400000}
nexus.cors.allowed-origins=${NEXUS_CORS_ALLOWED_ORIGINS:http://localhost:8080}
server.port=${PORT:8080}

# Configurações gerais
spring.output.ansi.enabled=always
logging.level.org.hibernate.SQL=${HIBERNATE_SQL_LOG_LEVEL:INFO}