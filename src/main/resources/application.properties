# Configuração do Banco de Dados SQLite
spring.datasource.url=jdbc:sqlite:gestao-funcionarios.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.username=
spring.datasource.password=

# Configurações do Hibernate / JPA para SQLite
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.community.dialect.SQLiteDialect

# Configurações de Segurança / JWT (Necessário para o JwtTokenProvider)
nexus.jwt.secret=9a4f2c8d3b7a1e6f5c8b9a2d3e4f5a6b7c8d9e0f1a2b3c4d5e6f7a8b9c0d1e2f
nexus.jwt.expiration=86400000

# Configurações gerais
spring.output.ansi.enabled=always
logging.level.org.hibernate.SQL=DEBUG